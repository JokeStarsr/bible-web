services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_URL: /api/v1

  nginx:
    image: nginx:alpine
    container_name: bible-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
