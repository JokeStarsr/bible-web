version: '3.8'

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: bible-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: bible
      POSTGRES_USER: bible_user
      POSTGRES_PASSWORD: bible_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible_user -d bible -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: bible-redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Spring Boot 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bible-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      # 挂载整个 uploads 目录，包含 qt-photos 和 chat-files 子目录，
      # 使后端写入的图片/语音文件能被 nginx 容器读取并静态服务
      - uploads:/opt/bible-web/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://127.0.0.1:5432/bible
      DB_USER: ${DB_USER:-bible_user}
      DB_PASS: ${DB_PASS:-bible_pass}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASS: ${REDIS_PASS:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_PASTOR_TO: ${MAIL_PASTOR_TO:-852341467@qq.com}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-7200}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-604800}
      SERVER_PORT: "8080"
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      # 视觉模型（用于 QT 灵修图片识别）：火山方舟豆包视觉模型
      LLM_VISION_API_KEY: ${LLM_VISION_API_KEY:-}
      LLM_VISION_BASE_URL: ${LLM_VISION_BASE_URL:-https://ark.cn-beijing.volces.com}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== Next.js 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bible-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: bible-nginx
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # 与 backend 共享同一 uploads 卷，nginx 静态服务 /uploads/ 下所有文件
      - uploads:/opt/bible-web/uploads
      # 备份文件下载目录（只读挂载）
      - ./backups:/opt/bible-web/backups:ro

  adminer:
    image: adminer:latest
    container_name: bible-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  uploads:
