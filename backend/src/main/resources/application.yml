spring:
  application:
    name: bible-backend

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bible}
    username: ${DB_USER:bible_user}
    password: ${DB_PASS:bible_pass}
    driver-class-name: org.postgresql.Driver

  # 上传文件大小限制：QT 灵修图片可能较大，放大到 20MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bible.module
  type-handlers-package: com.bible.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    from: ${MAIL_FROM:${MAIL_USER:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}

# ==================== 应用配置 ====================
app:
  jwt:
    secret: ${JWT_SECRET:bible-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expire: ${JWT_ACCESS_EXPIRE:7200}
    refresh-token-expire: ${JWT_REFRESH_EXPIRE:604800}
  verification-code:
    expire-seconds: 300
    send-interval-seconds: 60
  mail:
    pastor-to: ${MAIL_PASTOR_TO:852341467@qq.com}
  private-message:
    unlock-rounds: 20
  qt:
    upload-dir: /opt/bible-web/uploads/qt-photos
  chat:
    upload-dir: /opt/bible-web/uploads/chat-files
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model: ${LLM_MODEL:deepseek-chat}
    # 视觉模型（用于 QT 图片识别）。支持 OpenAI 兼容接口的多模态模型。
    # 豆包视觉：model=doubao-1.5-vision-pro, base-url=https://ark.cn-beijing.volces.com
    # 通义千问视觉：model=qwen-vl-plus, base-url=https://dashscope.aliyuncs.com
    # 留空或不配置 LLM_VISION_MODEL 时，自动降级为 Tesseract OCR
    vision-model: ${LLM_VISION_MODEL:}
    vision-api-key: ${LLM_VISION_API_KEY:}
    vision-base-url: ${LLM_VISION_BASE_URL:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.bible: DEBUG
    org.springframework.security: INFO
